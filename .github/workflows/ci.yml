name: CI — validation apprentissage et Listening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, FSRS et intégrité Listening
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: sqlite:////tmp/mentor-evolution-ci.db
      AUTO_CREATE_DB: "false"
      SECRET_KEY: ci-only-secret-key-not-for-production
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Vérifier la chaîne de migrations dans SQLite isolé
        run: |
          rm -f /tmp/mentor-evolution-ci.db
          flask --app main db upgrade
          flask --app main db current
          test "$(flask --app main db heads | wc -l | tr -d ' ')" -eq 1

      - name: Exécuter les tests backend et les contrôles de provenance audio
        run: pytest -q

  frontend:
    name: Lint et build du frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances frontend
        run: npm ci

      - name: Vérifier le lint
        run: npm run lint

      - name: Construire le frontend Vite
        run: npm run build
